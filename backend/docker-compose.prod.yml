# Production stack on the Hetzner box. Run by deploy/deploy.sh from the git
# checkout at /opt/assistant/repo; never edit the server copy by hand.
#
# Runtime state lives outside the checkout, in /opt/assistant/, so a
# `git reset --hard` on deploy can't touch it:
#   .env    — secrets (Telegram, OpenAI, REAUTH_SECRET, ...)
#   config/ — projects.yaml / channels.yaml (edited live from /projects)
#   data/   — SQLite DB + Google OAuth token
services:
  personal-assistant:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: personal-assistant:latest
    container_name: personal-assistant
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /opt/assistant/.env:/app/.env:ro
      - /opt/assistant/config:/app/config
      - /opt/assistant/data:/app/data
    # Steady state is ~190 MiB; the box has 4 GB shared by every app.
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
