# Production stack on the Hetzner box. Run by deploy/deploy.sh from the git
# checkout at /opt/assistant/repo; never edit the server copy by hand.
#
# Runtime state lives outside the checkout, in /opt/assistant/, so a
# `git reset --hard` on deploy can't touch it:
#   .env    — secrets (Telegram, OpenAI, REAUTH_SECRET, ...)
#   config/ — projects.yaml / channels.yaml (edited live from /projects)
#   data/   — SQLite DB + Google OAuth token
services:
  personal-assistant:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: personal-assistant:latest
    container_name: personal-assistant
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /opt/assistant/.env:/app/.env:ro
      - /opt/assistant/config:/app/config
      - /opt/assistant/data:/app/data
    # Steady state is ~190 MiB; the box has 4 GB shared by every app.
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Public demo (demo.alphatronex.com): same image, DEMO_MODE=true, sample data,
  # no login. Deliberately gets NO .env and NO data volume — it has no
  # Telegram/OpenAI/Google credentials to leak, and its SQLite file lives in
  # the container, reset on startup, nightly at 03:00 and on every deploy.
  personal-assistant-demo:
    image: personal-assistant:latest
    container_name: personal-assistant-demo
    depends_on:
      - personal-assistant   # built by that service
    restart: unless-stopped
    environment:
      DEMO_MODE: "true"
      GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - "127.0.0.1:8001:8000"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
